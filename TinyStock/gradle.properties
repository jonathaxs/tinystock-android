# Memoria do daemon do Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Pula a fase de configuracao quando os scripts de build nao mudaram.
org.gradle.configuration-cache=true
kotlin.code.style=official
# AGP 9 (Kotlin embutido) bloqueia o kotlin.sourceSets DSL por padrao; o KSP usa esse DSL para registrar
# o codigo que gera (Room). A flag reabilita, conforme a mensagem do erro.
android.disallowKotlinSourceSets=false
